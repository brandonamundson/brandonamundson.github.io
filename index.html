
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Website Coming Soon</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #101827;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        .container {
            max-width: 650px;
            padding: 40px 20px;
        }

        .icon {
            font-size: 55px;
            color: #00bcd4;
            margin-bottom: 25px;
        }

        h1 {
            font-size: 42px;
            margin-bottom: 20px;
            letter-spacing: 2px;
        }

        p {
            font-size: 18px;
            line-height: 1.7;
            color: #b8c4d6;
            margin-bottom: 15px;
        }

        .status {
            display: inline-block;
            margin-top: 25px;
            padding: 10px 22px;
            border: 1px solid #00bcd4;
            border-radius: 25px;
            color: #00bcd4;
            font-size: 13px;
            letter-spacing: 2px;
        }

        footer {
            position: absolute;
            bottom: 20px;
            color: #718096;
            font-size: 12px;
        }

        @media (max-width: 600px) {
            h1 {
                font-size: 30px;
            }

            p {
                font-size: 16px;
            }
        }
    </style>
</head>

<body>

    <div class="container">
        <div class="icon">&#9881;</div>

        <h1>UNDER CONSTRUCTION</h1>

        <p>
            We're working behind the scenes to build
            something innovative.
        </p>

        <p>
            Our new site will be launching soon.
            Check back for updates!
        </p>

        <div class="status">
            <span>&#9679;</span> WEBSITE IN DEVELOPMENT
        </div>
    </div>

    <footer>
        &copy; All Rights Reserved.
    </footer>

</body>
</html>
